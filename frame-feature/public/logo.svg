<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Orange Arc Glow -->
    <filter id="arcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF5E14" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Orange Circular Arc Framing Top (approx 240 deg arc) -->
  <path
    d="M 190 560 A 270 270 0 1 1 610 560"
    fill="none"
    stroke="#FF5E14"
    stroke-width="3"
    stroke-linecap="round"
    filter="url(#arcGlow)"
  />

  <!-- The Bold Stylized 'F' Monogram -->
  <g fill="#FFFFFF">
    <!-- Top Bar & Stem -->
    <path
      d="M 272 270 
         C 272 252 286 238 304 238 
         L 510 238 
         C 536 238 554 250 554 268 
         C 554 286 525 315 480 320 
         L 350 320 
         L 350 415 
         L 272 415 
         Z"
    />
    <!-- Lower Stem & Middle Bar -->
    <path
      d="M 272 415 
         C 272 415 272 435 290 435 
         L 480 435 
         C 505 435 510 455 510 465 
         C 510 482 485 512 445 512 
         L 343 512 
         L 343 620 
         C 343 670 290 705 272 705 
         L 272 415 
         Z"
    />
  </g>

  <!-- FRAME FEATURE Typography -->
  <text
    x="400"
    y="760"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="44"
    letter-spacing="14"
    fill="#FFFFFF"
    text-anchor="middle"
  >
    FRAME FEATURE
  </text>
</svg>
